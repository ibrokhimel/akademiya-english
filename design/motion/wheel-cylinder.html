<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akademiya · Cylinder time picker</title>
<style>
@font-face{font-family:Nunito;src:url('/src/mobile/node_modules/@expo-google-fonts/nunito/900Black/Nunito_900Black.ttf');font-weight:900;font-display:swap}
@font-face{font-family:Nunito;src:url('/src/mobile/node_modules/@expo-google-fonts/nunito/700Bold/Nunito_700Bold.ttf');font-weight:700;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#F1F0F7;color:#2B2B3C;font:700 15px/1.4 Nunito,system-ui,sans-serif}
main{min-height:100dvh;display:flex;align-items:center;justify-content:center;gap:64px;padding:36px 24px}
.phone{width:390px;height:min(780px,90dvh);min-height:600px;flex:none;background:#fff;border:1px solid #E5E5E5;border-radius:32px;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:28px 20px 18px}.back{color:#8A8AA0;font-size:28px;line-height:1}.steps{display:flex;gap:6px}.steps i{width:24px;height:8px;border-radius:4px;background:#7B5CFF}.steps i:last-child{width:40px}
.guide{padding:16px 24px 0;font-size:23px;font-weight:900;line-height:1.3}.sub{padding:8px 24px 0;margin:0;color:#8A8AA0;font-size:14px}
.middle{flex:1;display:flex;align-items:center;padding:24px 20px}
.wheel{width:100%;height:232px;background:#F6F6FA;border-radius:20px;overflow:hidden;position:relative;touch-action:none;cursor:grab;user-select:none;isolation:isolate;outline:none}.wheel:active{cursor:grabbing}.wheel:focus-visible{outline:3px solid #C9BDFF;outline-offset:4px}
.selected{position:absolute;left:12px;right:12px;top:92px;height:48px;border-radius:12px;background:#fff;border:2px solid #7B5CFF;pointer-events:none}
.number{position:absolute;top:50%;left:0;width:100%;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;font-weight:900;will-change:transform,opacity;backface-visibility:hidden;pointer-events:none;font-variant-numeric:tabular-nums}
.bottom{padding:12px 16px 28px;display:flex;flex-direction:column;gap:12px}.save{border:0;background:#7B5CFF;color:#fff;border-radius:16px;box-shadow:0 4px #5A3FD9;height:48px;font:900 15px Nunito;letter-spacing:.6px;cursor:pointer}.save:active{transform:translateY(4px);box-shadow:0 0 #5A3FD9}.skip{border:0;background:none;color:#8A8AA0;font:900 14px Nunito;padding:8px;cursor:pointer}
aside{max-width:320px}h1{font-size:30px;line-height:1.15;margin:0 0 18px;font-weight:900}aside p{color:#6E6E82;margin:0 0 26px}.modes{display:flex;gap:8px;margin:0 0 28px}.modes button,.replay{border:2px solid #E5E5E5;border-radius:12px;background:#fff;padding:10px 16px;font:900 14px Nunito;color:#2B2B3C;cursor:pointer}.modes button[aria-pressed=true]{border-color:#7B5CFF;background:#EFEBFF;color:#7B5CFF}
label{display:flex;justify-content:space-between;font-weight:900}input{width:100%;accent-color:#7B5CFF;margin:14px 0 26px}.note{font-size:13px!important;margin-top:26px!important}.readout{color:#7B5CFF;font-weight:900}.replay{color:#7B5CFF;border-color:#C9BDFF}.live{min-height:20px;color:#7B5CFF;text-align:center;font-size:12px}
@media(max-width:800px){main{gap:28px;flex-direction:column;padding:24px 16px}.phone{width:min(390px,100%);height:700px;min-height:600px}aside{max-width:390px;width:100%}}
@media(prefers-reduced-motion:reduce){.number{will-change:auto}}
</style>
</head>
<body>
<main>
  <section class="phone" aria-label="Reminder screen preview">
    <div class="top" aria-hidden="true"><span class="back">‹</span><div class="steps"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="guide">Har kuni soat nechada eslatay?</div>
    <p class="sub">Kuniga bir martagina eslataman.</p>
    <div class="middle"><div class="wheel" id="wheel" role="slider" tabindex="0" aria-label="Reminder time" aria-valuemin="0" aria-valuemax="47"><div class="selected"></div></div></div>
    <div class="bottom"><div class="live" id="live" aria-live="polite"></div><button class="save" id="save">ESLATMANI YOQISH</button><button class="skip" id="reset">HOZIR EMAS</button></div>
  </section>
  <aside>
    <h1>Like numbers on a cylinder.</h1>
    <p>Drag up or down, flick, scroll, or use ↑ ↓. The middle stays large and flat; the other times shrink and tilt away.</p>
    <div class="modes" aria-label="Compare effects"><button data-mode="cylinder" aria-pressed="true">Cylinder</button><button data-mode="flat" aria-pressed="false">Flat list</button></div>
    <label for="curve">Curvature <output id="curveValue">26°</output></label>
    <input type="range" id="curve" min="16" max="34" value="26" step="1">
    <button class="replay" id="replay">Replay a spin</button>
    <p class="note">Preview only. Selected time: <span class="readout" id="readout">19:00</span>. No reminder will be scheduled.</p>
  </aside>
</main>
<script>
const times=Array.from({length:48},(_,i)=>`${String(i>>1).padStart(2,'0')}:${i%2?'30':'00'}`);
const wheel=document.querySelector('#wheel'), live=document.querySelector('#live');
const labels=times.map((t,i)=>{const el=document.createElement('div');el.className='number';el.textContent=t;el.dataset.index=i;el.setAttribute('aria-hidden','true');wheel.append(el);return el});
let pos=38,goal=38,curve=26,mode='cylinder',raf=0,drag=null;
const wrap=v=>((v%48)+48)%48;
const near=(i,p)=>wrap(i-p+24)-24;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(){
 const selected=wrap(Math.round(pos)),theta=curve*Math.PI/180,radius=44/theta;
 labels.forEach((el,i)=>{
  const delta=near(i,pos),distance=Math.abs(delta),angle=delta*theta;
  if(distance>3.3){el.style.visibility='hidden';return}el.style.visibility='visible';
  const y=mode==='cylinder'?radius*Math.sin(angle):delta*44;
  const z=mode==='cylinder'?radius*(Math.cos(angle)-1):0;
  const scale=mode==='cylinder'?Math.max(.42,1-distance*.18):(distance<.5?1:.75);
  const tilt=mode==='cylinder'?-delta*curve:0;
  el.style.transform=`translateY(-50%) perspective(480px) translate3d(0,${y}px,${z}px) rotateX(${tilt}deg) scale(${scale})`;
  el.style.opacity=Math.max(0,1-distance*.29);
  const blend=Math.min(1,distance/.85),a=[123,92,255],b=[138,138,160];
  el.style.color=`rgb(${a.map((v,j)=>Math.round(v+(b[j]-v)*blend)).join(',')})`;
 });
 wheel.setAttribute('aria-valuenow',selected);wheel.setAttribute('aria-valuetext',times[selected]);
 document.querySelector('#readout').textContent=times[selected];
 window.wheelPreview={position:pos,index:selected,time:times[selected],curve,mode};
}
function stop(){cancelAnimationFrame(raf);raf=0}
function glide(to,tau=100){stop();goal=to;const from=pos,start=performance.now();
 if(reduced){pos=to;draw();return}
 function step(now){pos=to-(to-from)*Math.exp(-(now-start)/tau);if(Math.abs(to-pos)<.005)pos=to;draw();raf=pos===to?0:requestAnimationFrame(step)}
 raf=requestAnimationFrame(step);
}
wheel.addEventListener('pointerdown',e=>{stop();drag={y:e.clientY,p:pos,points:[[e.timeStamp,e.clientY]],moved:false};wheel.setPointerCapture(e.pointerId)});
wheel.addEventListener('pointermove',e=>{if(!drag)return;const dy=e.clientY-drag.y;if(Math.abs(dy)>3)drag.moved=true;if(!drag.moved)return;pos=drag.p-dy/44;draw();drag.points.push([e.timeStamp,e.clientY]);while(drag.points.length>2&&e.timeStamp-drag.points[0][0]>90)drag.points.shift()});
function release(e){if(!drag)return;const d=drag;drag=null;
 if(e.type==='pointercancel'){glide(Math.round(pos));return}
 if(!d.moved){const rect=wheel.getBoundingClientRect(),dy=e.clientY-rect.top-rect.height/2,radius=44/(curve*Math.PI/180);const delta=mode==='cylinder'?Math.asin(Math.max(-.99,Math.min(.99,dy/radius)))/(curve*Math.PI/180):dy/44;glide(Math.round(pos+delta));return}
 const [t1,y1]=d.points[0],[t2,y2]=d.points.at(-1);const velocity=t2===t1||e.timeStamp-t2>60?0:Math.max(-.035,Math.min(.035,-(y2-y1)/44/(t2-t1)));
 glide(Math.round(pos+velocity*240),Math.abs(velocity)>.0015?240:80);
}
wheel.addEventListener('pointerup',release);wheel.addEventListener('pointercancel',release);
wheel.addEventListener('wheel',e=>{e.preventDefault();glide((raf?goal:Math.round(pos))+Math.sign(e.deltaY),90)},{passive:false});
wheel.addEventListener('keydown',e=>{let to;if(e.key==='ArrowDown')to=Math.round(pos)+1;else if(e.key==='ArrowUp')to=Math.round(pos)-1;else if(e.key==='Home')to=0;else if(e.key==='End')to=47;else return;e.preventDefault();glide(to)});
document.querySelector('#curve').addEventListener('input',e=>{curve=Number(e.target.value);document.querySelector('#curveValue').textContent=curve+'°';draw()});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw()}));
document.querySelector('#replay').addEventListener('click',()=>{glide(Math.round(pos)+7,280)});
document.querySelector('#save').addEventListener('click',()=>{glide(Math.round(pos));live.textContent=`${times[wrap(Math.round(pos))]} — preview only`});
document.querySelector('#reset').addEventListener('click',()=>{live.textContent='';glide(38,180)});
draw();
</script>
</body>
</html>
