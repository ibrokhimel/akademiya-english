<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Akademiya Exercise Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <p class="brand-name">Akademiya English</p>
        <p class="brand-sub">Exercise Lab · Unit 3: At the café</p>
      </div>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Learning mode" id="mode-seg"></div>
      <div class="seg" role="group" aria-label="Explanation language" id="l1-seg"></div>
      <span class="later" id="later" title="Nothing saved">Saved for later: 0</span>
      <button class="later speak-on" id="speak-on" hidden>Speaking is off · Turn on</button>
    </div>
  </header>

  <div class="layout">
    <nav class="side" id="nav" aria-label="Exercise types"></nav>
    <main class="stage">
      <section class="meta" id="meta"></section>
      <section class="phone">
        <div class="card" id="card"></div>
      </section>
      <section class="rate" id="rate"></section>
    </main>
  </div>

  <script src="js/core.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ex-input.js"></script>
  <script src="js/ex-output.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
