<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Progress pages check</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design/motion/tokens.css">
<link rel="stylesheet" href="/design/motion/components.css">
<link rel="stylesheet" href="/src/web/progresspage.css">
<style>
  body { margin: 0; padding: 0; background: var(--bg); }
  #phone { transform: none; border-radius: 0; border: 0; }
  #host { position: absolute; left: 0; right: 0; top: 0; bottom: 94px; }
  .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 94px; background: var(--card); border-top: 2px solid var(--grey); z-index: 5; }
  #park { position: absolute; left: -9999px; }
</style>
</head>
<!-- Mounts the Progress tab pages with real content and made-up events: ?page=24|25|26&data=full|empty&dark=1&today=1 -->
<body>
<div class="phone" id="phone"><div id="host"></div><div class="tabs"></div></div><div id="park"></div>
<script src="/design/rive/node_modules/@rive-app/canvas/rive.js"></script>
<script src="/design/motion/motion.js"></script>
<script src="/design/motion/voice.js"></script>
<script src="/design/motion/lab.js"></script>
<script src="/design/motion/sound.js"></script>
<script src="/design/motion/haptic.js"></script>
<script src="/design/motion/widgets.js"></script>
<script type="module">
import { loadContent, C } from '/src/web/content.js';
import { progressOf } from '/src/core/progress.js';
import { renderProgress, thingsICanSay, streakCalendar } from '/src/web/progresspage.js';
const q = new URLSearchParams(location.search), page = q.get('page') || '24', full = q.get('data') !== 'empty', todayDone = q.get('today') === '1';
if (q.get('dark') === '1') document.body.classList.add('dark');
await loadContent();
const NOW = new Date('2026-10-14T18:00:00');
// lessons in course order on these days: Oct 1-2, a break, then Oct 5-13 with Oct 7 missed (a freeze); today too with ?today=1
const days = ['2026-10-01', '2026-10-02', '2026-10-05', '2026-10-06', '2026-10-08', '2026-10-09', '2026-10-10', '2026-10-11', '2026-10-12', '2026-10-13', ...(todayDone ? ['2026-10-14'] : [])];
const order = C.units.flatMap((u) => [...u.lessons.map((l) => l.id), u.checkpoint.id]);
const events = full ? days.map((d, i) => ({ type: 'lesson', id: order[i], at: new Date(d + 'T12:00:00').toISOString(), accuracy: 90, mistakes: 1, spokenMs: 95000, skipped: 0 })) : [];
const ctx = { phone: document.querySelector('#phone'), C, events, now: () => NOW, progress: () => progressOf(C.units, events, { now: NOW }),
  rec: { has: (id) => id === 'hello' || id === 'im-aziz', play: async () => {} }, practise: (id) => console.log('practise', id) };
renderProgress(document.querySelector('#host'), ctx);
if (page === '25') thingsICanSay(ctx); if (page === '26') streakCalendar(ctx);
window.ready = true;
</script>
</body>
</html>
